<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport twin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1522;color:#edf2f8;font:16px system-ui}header{height:80px;padding:14px 26px;border-bottom:1px solid #344354;display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}header small{color:#9bacbe}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 80px)}#stage{position:relative;overflow:hidden}#stage canvas{display:block}aside{padding:24px;background:#142234;overflow:auto}button,select{border:1px solid #506379;border-radius:7px;background:#253951;color:white;padding:10px;margin:5px 3px;cursor:pointer}select{width:100%;margin:8px 0 20px}#identity{word-break:break-all;font:13px monospace;color:#b4c7dc;line-height:1.8}.label{background:#102130e8;border:1px solid #7994a5;border-radius:5px;padding:5px 12px;font-size:18px;font-weight:650;color:#fff;pointer-events:none}#message{position:absolute;bottom:20px;left:24px;background:#102130e8;border:1px solid #48627d;border-radius:8px;padding:14px;max-width:90%}#fallback{width:100%;height:100%;object-fit:contain;display:none}.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}.key{display:flex;justify-content:space-between;margin:22px 0}.thresholds{font-size:13px;line-height:1.8;color:#bbcadb}a{color:#9eddf8}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px;border-bottom:1px solid #344354}#metrics p{margin:10px 0}#timeline{width:100%;margin:18px 0}#step{font:14px monospace}#status{font-size:13px;color:#91bca8}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{padding:20px}}
