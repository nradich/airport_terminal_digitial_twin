<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport twin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1522;color:#edf2f8;font:16px system-ui}header{height:88px;padding:12px 26px;border-bottom:1px solid #344354;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:24px;margin:0}header small{color:#9bacbe}header .title{display:flex;flex-direction:column;gap:6px;min-width:0}#message{margin:0;background:#102130e8;border:1px solid #48627d;border-radius:8px;padding:6px 12px;max-width:min(720px,70vw);font-size:14px;line-height:1.35;width:fit-content}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 88px)}#stage{position:relative;overflow:hidden}#stage canvas{display:block}aside{padding:24px;background:#142234;overflow:auto}button,select{border:1px solid #506379;border-radius:7px;background:#253951;color:white;padding:10px;margin:5px 3px;cursor:pointer}select{width:100%;margin:8px 0 20px}#identity{word-break:break-all;font:13px monospace;color:#b4c7dc;line-height:1.8}.label{background:#102130e8;border:1px solid #7994a5;border-radius:5px;padding:5px 12px;font-size:18px;font-weight:650;color:#fff;pointer-events:none;white-space:nowrap}#fallback{width:100%;height:100%;object-fit:contain;display:none}.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}.key{display:flex;justify-content:space-between;margin:22px 0}.thresholds{font-size:13px;line-height:1.8;color:#bbcadb}a{color:#9eddf8}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px;border-bottom:1px solid #344354}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px}#metrics p{margin:6px 0;font-size:13px;overflow-wrap:anywhere}#provenance{scroll-margin-top:12px}#provenance h3{margin:12px 0 8px}#provenance td,#provenance th{font-size:12px;padding:5px;text-align:left}#source-versions,#rule,#verification{font-size:12px;overflow-wrap:anywhere}#timeline{width:100%;margin:18px 0}#step{font:14px monospace}#status{font-size:13px;color:#91bca8;white-space:nowrap}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{padding:20px}#message{max-width:100%}}

body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{height:auto;min-height:88px;flex-shrink:0}
main{flex:1;min-height:0;height:auto}
.workspace-embedded header small{display:none}
@media(max-width:800px){
 body{height:auto;min-height:100dvh;overflow:auto}
 header{flex-wrap:wrap;padding:14px 20px}
 #status{white-space:normal}
 main{flex:none;min-height:0;grid-template-rows:minmax(320px,55vh) auto}
}
</style></head><body><header><div class="title"><h1>Airport / Concourse A</h1><small>Same Delta data. Two renderers.</small><div id="message">Loading the concourse…</div></div><span id="status">Connecting to governed data…</span></header><main><section id="stage"><img id="fallback" alt="Published scene frame"></section><aside><h2 id="mode">Audited replay</h2><label for="run">Scenario / MLflow run</label><select id="run"></select><button id="refresh">Refresh data</button><div id="identity"></div><div><button id="overview">Overview</button><button id="closeup">Gate A4 close-up</button></div><button id="image">Image playback</button><div class="key"><span><i class="swatch" style="background:#22c55e"></i>OK</span><span><i class="swatch" style="background:#f59e0b"></i>Warning</span><span><i class="swatch" style="background:#ef4444"></i>Critical</span></div><details><summary>Threshold reference</summary><div id="thresholds" class="thresholds"></div></details><div><button id="play">Play</button><span id="step"></span><input id="timeline" type="range" min="0" max="59" value="59" aria-label="Simulation minute"></div><div id="metrics"></div><section id="provenance" aria-live="polite"><p><a id="compare" rel="noopener" aria-disabled="true">Compare in MLflow</a><small id="comparison-note"></small></p><h3 id="gate-title">Select a gate</h3><strong id="explanation"></strong><p id="verification"></p><table><thead><tr><th>Signal</th><th>Value</th><th>Warn / crit</th><th>Status</th></tr></thead><tbody id="sensors"></tbody></table><p id="rule"></p><p id="source-versions"></p><details id="provenance-details"><summary>Details</summary><p><a id="mlflow" rel="noopener">Individual MLflow run</a></p><pre id="audit-details" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:260px;overflow:auto"></pre></details></section><h3>Gate health</h3><table><tbody id="health"></tbody></table></aside></main><script type="module" src="./viewer.js"></script></body></html>
